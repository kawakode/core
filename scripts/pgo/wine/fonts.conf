<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Polices visibles par Wine pendant le profilage : un jeu réduit, car
     DirectWrite sous Wine plante sur certaines polices du système (Noto). -->
<fontconfig>
  <dir>/usr/share/fonts/liberation</dir>
  <dir>/usr/share/fonts/TTF</dir>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <dir>/usr/share/fonts/truetype/liberation</dir>
  <cachedir prefix="xdg">fontconfig-core-pgo</cachedir>
</fontconfig>
