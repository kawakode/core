<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Security-Policy"
        content="default-src chrome:; object-src 'none';" />
  <title>Historique</title>
  <link rel="stylesheet" href="chrome://core/content/pages.css" />
  <link rel="stylesheet" href="chrome://core/content/history.css" />
  <script src="chrome://core/content/history.js"></script>
</head>
<body>
  <h1>Historique</h1>
  <div id="controls">
    <input id="search" type="search" placeholder="Rechercher dans l'historique"
           aria-label="Rechercher dans l'historique" autofocus="true" />
    <select id="clear-range" aria-label="Période à effacer">
      <option value="hour">Dernière heure</option>
      <option value="today">Aujourd'hui</option>
      <option value="all">Tout</option>
    </select>
    <button id="clear">Effacer</button>
  </div>
  <p id="disabled-note" class="muted" hidden="true">
    Core n'enregistre pas les pages visitées (Réglages).
  </p>
  <div id="list" role="list"></div>
  <p id="empty" class="muted" hidden="true"></p>
  <div id="more"></div>
</body>
</html>
